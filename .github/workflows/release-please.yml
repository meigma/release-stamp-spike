name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Finding: with GITHUB_TOKEN, the tag Release Please creates does not
      # trigger tag-push workflows. meigma/release already mints an App token for
      # this job, which is what makes its release chain fire; this scratch repo
      # cannot install that App without an organization owner, so the asset job
      # below is dispatched manually instead.
      - name: Run Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
